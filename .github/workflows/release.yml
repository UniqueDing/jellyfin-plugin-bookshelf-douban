name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore "Jellyfin.Plugin.DoubanBookshelf.sln"

      - name: Test
        run: dotnet test "Jellyfin.Plugin.DoubanBookshelf.sln" --configuration Release --no-restore --logger "console;verbosity=minimal"

      - name: Package plugin
        run: ./scripts/package-plugin.sh

      - name: Generate plugin manifest
        run: python3 ./scripts/generate_manifest.py ./dist/*.zip "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.zip.sha256

      - name: Publish plugin manifest
        uses: softprops/action-gh-release@v2
        with:
          name: manifest
          tag_name: manifest
          files: manifest.json
